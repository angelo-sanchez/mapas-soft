<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>MapasSoft</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body class="mat-typography">
  <app-root></app-root>
  <!-- Modal -->
<div class="modal fade" id="configModal" tabindex="-1" aria-labelledby="configModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
      <div class="modal-content">
          <div class="modal-header">
              <h5 class="modal-title">Configurar</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
              <fieldset id="basemapForm" class="form-group">
                  <div class="row">
                      <legend class="col-form-label col-sm-2 pt-0">Mapa base</legend>
                      <div class="col-sm-10" id='baseOptions'>
                      </div>
                  </div>
              </fieldset>

              <fieldset id="overlayForm" class="form-group">
                  <div class="row">
                      <legend class="col-form-label col-sm-2 pt-0">Capas</legend>
                      <div class="col-sm-10" id='dataLayers'>
                      </div>
                  </div>
              </fieldset>

              <fieldset id="icvConfig" class="form-group collapse show">
                  <div class="row">
                      <legend class="col-form-label col-sm-2 pt-0">Colores ICV</legend>
                      <div class="col-sm-10" id='colorOptions'>
                      </div>
                  </div>
              </fieldset>

          </div>
          <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
              <button id="save" type="button" class="btn btn-primary" data-bs-dismiss="modal">Aceptar</button>
          </div>
      </div>
  </div>
</div>

</body>
</html>
